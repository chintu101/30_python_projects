<!DOCTYPE html>
<html>
<head>
    <title>Web Alarm Clock</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            font-size: 1.2em;
            padding: 10px;
        }
        #alarm-set-msg, #message {
            font-size: 1.3em;
            margin-top: 20px;
        }
        #message {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Set Alarm</h1>
    <form method="POST">
        <input type="time" name="alarm_time" required>
        <button type="submit">Set Alarm</button>
    </form>

    <div id="alarm-set-msg">
        {% if message %}
            {{ message }}
        {% endif %}
    </div>

    <div id="message"></div>

    <script>
        setInterval(() => {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.triggered) {
                        document.getElementById('message').textContent = "⏰ Time to wake up!";
                    }
                });
        }, 1000);
    </script>
</body>
</html>
