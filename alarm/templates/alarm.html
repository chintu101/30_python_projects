<!DOCTYPE html>
<html>
<head>
    <title>Web Alarm Clock</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            font-size: 1.2em;
            padding: 10px;
        }
        #message {
            font-size: 1.5em;
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Set Alarm</h1>
    <form method="POST">
        <input type="time" name="alarm_time" required>
        <button type="submit">Set Alarm</button>
    </form>

    <div id="message"></div>

    <script>
        setInterval(() => {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.triggered) {
                        document.getElementById('message').textContent = "⏰ Time to wake up!";
                    }
                });
        }, 1000); // check every second
    </script>
</body>
</html>
